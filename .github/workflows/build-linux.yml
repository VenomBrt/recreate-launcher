name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Icons
        run: npm run icons || true

      - name: Fetch essential mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ensure-essential-mod.js

      - name: Build AppImage + deb
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recreate-linux-${{ github.ref_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error

      - name: Publish to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            dist/Recreate-${VERSION}.AppImage \
            dist/Recreate-Setup-${VERSION}.deb \
            --clobber || \
          gh release create "$GITHUB_REF_NAME" \
            dist/Recreate-${VERSION}.AppImage \
            dist/Recreate-Setup-${VERSION}.deb \
            --title "Recreate $GITHUB_REF_NAME" \
            --notes "Build Linux (AppImage + instalador .deb)"
